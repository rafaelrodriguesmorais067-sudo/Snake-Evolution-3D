<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <title>Snake Evolution 3D</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <canvas id="c"></canvas>

    <div id="hud" hidden>
        <div>
            <b id="sc">0</b> pts · recorde <span id="hi">0</span>
        </div>
        <div id="lv"></div>
        <div id="bar">
            <i id="barf"></i>
        </div>
        <div id="cn"></div>
        <div id="bf"></div>
    </div>

    <div id="toast"></div>
    <div id="p"></div>

    <div id="joy" hidden>
        <i id="knob"></i>
    </div>

    <button id="boost" hidden>⚡</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="Game.js"></script>

</body>
</html>
